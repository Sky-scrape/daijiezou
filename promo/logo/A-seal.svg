<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="带节奏">
<!-- 定稿「印章」:朱红印面 + 阴刻「节」+ 纸底金色三连阳
     纸墨主题铁律:零渐变、平涂、硬边偏移压印阴影、小圆角。
     「节」= SimHei 真实字形轮廓(由 promo/logo/glyph.py 提取),非手搭矩形。
     蜡烛必须落在纸底而非印面:金(#8a6410)压朱红(#c2261d)只有 1.09:1,等于看不见;
     压纸底(#f4ecd8)是 4.56:1。 -->
  <defs>
    <pattern id="ht" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#1d1a16" opacity="0.055"/>
    </pattern>
    <!-- 阴刻:印面朱红,字形镂空见纸色 -->
    <mask id="carve">
      <rect x="56" y="52" width="356" height="332" fill="#fff"/>
      <g transform="translate(104.25 311.48) scale(1.02165 -1.02165)">
        <path fill="#000" d="M158 32Q178 32 188.5 34.0Q199 36 200 46L202 100H117V13Q117 -5 118 -24H95Q97 -6 97 13V100H75Q42 100 22 99V118Q43 117 65 117H225Q222 75 221.0 49.0Q220 23 206.0 16.5Q192 10 168 8Q166 20 158 32ZM99 158Q99 140 100 127H78Q79 142 79 158H45Q31 158 14 156V176Q31 175 45 175H79Q79 194 78 207H100Q99 194 99 175H152Q152 195 151 207H174Q173 195 173 175H205Q224 175 240 176V157Q224 158 205 158H173Q173 142 174 127H151Q152 143 152 158Z"/>
      </g>
    </mask>
  </defs>

  <!-- 纸底 + 半调网点,与全站 body 同一张纸 -->
  <rect width="512" height="512" rx="8" fill="#f4ecd8"/>
  <rect width="512" height="512" rx="8" fill="url(#ht)"/>

  <!-- 硬边压印阴影 -->
  <rect x="66" y="62" width="356" height="332" rx="6" fill="#1d1a16" opacity="0.17"/>
  <!-- 朱红印面,「节」阴刻 -->
  <rect x="56" y="52" width="356" height="332" rx="6" fill="#c2261d" mask="url(#carve)"/>
  <!-- 边款留白框 -->
  <rect x="76" y="72" width="316" height="292" rx="4" fill="none" stroke="#f4ecd8" stroke-width="7" opacity="0.9"/>

  <!-- 金色三连阳:落在印面下方的纸底上,节奏被带出章外 -->
  <g fill="#8a6410">
    <rect x="176" y="410" width="10" height="56" rx="2"/>
    <rect x="164" y="422" width="34" height="32" rx="2"/>
    <rect x="245" y="396" width="10" height="70" rx="2"/>
    <rect x="233" y="408" width="34" height="46" rx="2"/>
    <rect x="314" y="386" width="10" height="80" rx="2"/>
    <rect x="302" y="390" width="34" height="62" rx="2"/>
  </g>
</svg>
